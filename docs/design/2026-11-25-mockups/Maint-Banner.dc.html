<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>점검 예고 배너</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm bg-white" style="min-height: 900px; display: flex; flex-direction: column">
  <div class="row" role="status" style="gap: 12px; padding: 8px 16px 8px 24px; background: #fff6df; color: #5c3800; border-bottom: 1px solid #f0dca8">
    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3 2 17h16L10 3Zm0 5v4m0 3v.01"></path></svg>
    <p class="t-small" style="flex: 1"><strong>점검 예정</strong> · [날짜 시각]부터 약 [소요 시간] 동안 서비스를 점검합니다. 점검 중에는 변환을 접수할 수 없어요.</p>
    <button class="ibtn" type="button" aria-label="점검 안내 닫기" style="color: #5c3800"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8"></path></svg></button>
  </div>
  <header class="topbar clean">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">H</span>HWP Make</a>
    <button class="btn" type="button">로그인</button>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 24px 112px">
    <div class="stack" style="width: 100%; max-width: 640px; gap: 28px">
      <h1 class="t-h1" style="text-align: center; font-size: 32px">파일을 넣어주세요</h1>
      <label class="dropzone" for="mbFile" style="min-height: 320px">
        <span class="dz-icon" aria-hidden="true"><svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M12 16V5m0 0L7.5 9.5M12 5l4.5 4.5M5 15.5v2.25A2.25 2.25 0 0 0 7.25 20h9.5A2.25 2.25 0 0 0 19 17.75V15.5"></path></svg></span>
        <strong style="margin-top: 6px; font-size: 18px">클릭하거나 여기에 놓으세요</strong>
        <span class="t-small muted">PDF, HWP, HWPX, DOCX, 이미지, TXT · 최대 64MB</span>
        <span class="btn btn-accent-outline" aria-hidden="true" style="margin-top: 10px">파일 선택</span>
      </label>
      <input id="mbFile" class="sr" type="file">
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
