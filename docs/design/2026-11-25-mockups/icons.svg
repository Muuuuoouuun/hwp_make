    <symbol id="i-chevron-right" viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5"></path></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 20 20"><path d="M4.5 7.5 10 13l5.5-5.5"></path></symbol>
