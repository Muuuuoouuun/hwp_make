<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- HWP Make 아이콘 세트 v1 (30) — 20×20, stroke 1.8, round cap/join, 내용은 2~18 안. 점 아이콘(grip·more)만 채움.
       사용: <svg class="icon" aria-hidden="true"><use href="#i-이름"/></svg>. 이 파일이 원본이며 화면·시안은 복사본을 쓴다. -->
  <defs>
    <symbol id="i-grip" viewBox="0 0 20 20"><g fill="currentColor" stroke="none"><circle cx="7.5" cy="5" r="1.2"></circle><circle cx="12.5" cy="5" r="1.2"></circle><circle cx="7.5" cy="10" r="1.2"></circle><circle cx="12.5" cy="10" r="1.2"></circle><circle cx="7.5" cy="15" r="1.2"></circle><circle cx="12.5" cy="15" r="1.2"></circle></g></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 20 20"><path d="M10 16V4M5 9l5-5 5 5"></path></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 20 20"><path d="M10 4v12M5 11l5 5 5-5"></path></symbol>
    <symbol id="i-close" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5 5 15"></path></symbol>
