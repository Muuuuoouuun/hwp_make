<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 변환 중</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm bg-white" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header class="topbar clean" style="padding: 0 16px; height: 60px">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">H</span>HWP Make</a>
    <button class="btn" type="button" style="padding: 0 14px">로그인</button>
  </header>
  <main class="stack" style="flex: 1; gap: 20px; padding: 16px 16px 24px">
    <div class="file-row" style="background: #f7f8fb">
      <span class="file-ico" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7z"></path><path d="M13.5 3.5V8H18"></path></svg></span>
      <span class="stack" style="flex: 1; min-width: 0; gap: 2px">
        <strong style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">2026 수능 대비 모의평가 수학.pdf</strong>
        <span class="t-small muted"><span class="ext">PDF</span> 4.2MB</span>
      </span>
    </div>
    <section class="card card-pad stack" style="gap: 18px; padding: 20px" aria-labelledby="mpTitle">
      <h1 id="mpTitle" class="t-h2">편집형 HWPX 변환 중</h1>
      <ol class="stack" style="gap: 10px" aria-label="변환 단계">
        <li class="step done"><span class="n" aria-hidden="true">✓</span>업로드</li>
        <li class="step now" aria-current="step"><span class="n">2</span>변환</li>
        <li class="step"><span class="n">3</span>결과 점검</li>
        <li class="step"><span class="n">4</span>다운로드</li>
      </ol>
      <div class="progress" role="progressbar" aria-label="변환 진행" aria-valuetext="변환 중, 진행량 확인 불가"><i style="width: 34%; margin-left: 28%"></i></div>
      <p class="t-small muted" role="status">긴 문서는 몇 분이 걸릴 수 있어요. 끝나면 다운로드가 자동으로 시작됩니다.</p>
    </section>
    <div style="flex: 1"></div>
    <button class="btn btn-danger btn-lg btn-block" type="button" aria-describedby="mCancelHelp">변환 취소</button>
    <p id="mCancelHelp" class="help">취소해도 서버에서 생성이 계속될 수 있으니 최근 변환에서 다시 확인해 주세요.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
