<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인증 메일 발송</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm" style="min-height: 900px; display: flex; flex-direction: column">
  <header class="topbar clean" style="background: transparent">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">H</span>HWP Make</a>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px 80px">
    <section class="card card-raise stack" style="width: 100%; max-width: 480px; gap: 18px; padding: 36px 32px; text-align: center; align-items: center" aria-labelledby="vfTitle">
      <span aria-hidden="true" style="display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: #edf2ff; color: #2f56c7"><svg class="icon icon-lg" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></span>
      <h1 id="vfTitle" class="t-h2" style="font-size: 22px">인증 메일을 보냈습니다</h1>
      <p class="soft"><strong>teacher@example.com</strong>으로 보낸 링크를 열면 가입이 끝납니다.</p>
      <div class="notice notice-ok t-small" style="width: 100%; text-align: left"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 10 3 3 7-7"></path></svg><span>인증 전에도 지금 화면에서 파일 변환은 계속할 수 있어요. 인증하면 그동안의 결과가 내 작업으로 옮겨집니다.</span></div>
      <p class="help" role="status">메일이 오지 않으면 스팸함을 확인하거나 다시 보내 주세요.</p>
      <div class="stack" style="width: 100%; gap: 8px">
        <button class="btn btn-lg btn-block" type="button">인증 메일 다시 보내기</button>
        <button class="btn btn-ghost btn-block" type="button">이메일 주소 바꾸기</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

</html>
