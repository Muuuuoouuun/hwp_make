<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기본 변환 중</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm bg-white" style="min-height: 900px; display: flex; flex-direction: column">
  <header class="topbar clean">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">H</span>HWP Make</a>
    <div class="row" style="gap: 8px">
      <button class="btn btn-ghost" type="button" aria-haspopup="dialog">도움말</button>
      <button class="btn" type="button">로그인</button>
    </div>
  </header>
  <main style="flex: 1; display: flex; justify-content: center; padding: 56px 24px 96px">
    <div class="stack" style="width: 100%; max-width: 640px; gap: 24px">
      <div class="file-row" style="background: #f7f8fb">
        <span class="file-ico" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7z"></path><path d="M13.5 3.5V8H18"></path></svg></span>
        <span class="stack" style="flex: 1; min-width: 0; gap: 2px">
          <strong style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">2026 수능 대비 모의평가 수학.pdf</strong>
          <span class="t-small muted"><span class="ext">PDF</span> 4.2MB · 변환 중에는 파일을 바꿀 수 없습니다</span>
        </span>
        <button class="ibtn" type="button" aria-label="선택한 파일 제거" disabled><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8"></path></svg></button>
      </div>

      <section class="card card-pad card-raise stack" style="gap: 20px" aria-labelledby="progTitle">
        <div class="row" style="justify-content: space-between; gap: 12px">
          <h1 id="progTitle" class="t-h2">편집형 HWPX 변환 중</h1>
          <span class="chip chip-info">진행 중</span>
        </div>
        <ol class="steps" aria-label="변환 단계">
          <li class="step done"><span class="n" aria-hidden="true">✓</span>업로드</li>
          <li class="step-line" aria-hidden="true"></li>
          <li class="step now" aria-current="step"><span class="n">2</span>변환</li>
          <li class="step-line" aria-hidden="true"></li>
          <li class="step"><span class="n">3</span>결과 점검</li>
          <li class="step-line" aria-hidden="true"></li>
          <li class="step"><span class="n">4</span>다운로드</li>
        </ol>
        <div class="progress" role="progressbar" aria-label="변환 진행" aria-valuetext="변환 중, 진행량 확인 불가"><i style="width: 34%; margin-left: 28%"></i></div>
        <p id="progStatus" class="status status-ready" role="status" aria-live="polite"><span class="dot"></span>2026 수능 대비 모의평가 수학.pdf · 편집형 HWPX 변환 중</p>
        <p class="t-small muted">긴 문서는 몇 분이 걸릴 수 있어요. 끝나면 다운로드가 자동으로 시작됩니다.</p>
      </section>

      <div class="grid-2" style="gap: 12px">
        <button class="btn btn-lg is-disabled" type="button" disabled aria-describedby="progStatus">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>변환 중...
        </button>
        <button class="btn btn-danger btn-lg" type="button" aria-describedby="cancelHelp">변환 취소</button>
      </div>
      <p id="cancelHelp" class="help" style="font-size: 13px">취소하면 이 화면의 대기를 멈춥니다. 서버에서 생성이 계속될 수 있으니 최근 변환에서 다시 확인해 주세요.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
