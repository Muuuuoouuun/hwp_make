<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프리미엄 로그인</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm bg-white" style="position: relative; min-height: 900px; overflow: hidden">
  <div aria-hidden="true" style="display: flex; flex-direction: column; min-height: 900px">
    <div class="topbar clean"><span class="brand"><span class="brand-mark">H</span>HWP Make</span><span class="btn">로그인</span></div>
    <div class="stack" style="width: 100%; max-width: 760px; margin: 56px auto 0; gap: 28px; padding: 0 24px">
      <div class="file-row"><span class="file-ico"></span><span class="stack" style="flex: 1; gap: 6px"><span class="ghost-block" style="width: 240px; height: 14px"></span><span class="ghost-block" style="width: 90px; height: 10px"></span></span></div>
      <p class="t-h1" style="text-align: center">20개 문항을 인식했습니다</p>
      <div class="grid-2" style="gap: 20px"><div class="card" style="height: 260px"></div><div class="card" style="height: 260px"></div></div>
    </div>
  </div>
  <div class="scrim"></div>
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px">
    <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="loginTitle" style="width: 100%; max-width: 460px">
      <div class="dialog-head">
        <div class="stack" style="gap: 6px">
          <span class="badge badge-premium" style="align-self: flex-start">Premium</span>
          <h2 id="loginTitle" class="t-h2">로그인하고 문항 편집</h2>
        </div>
        <button class="ibtn" type="button" aria-label="닫기"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8"></path></svg></button>
      </div>
      <div class="dialog-body stack" style="gap: 16px">
        <div class="file-row" style="background: #f7f8fb">
          <span class="file-ico" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7z"></path><path d="M13.5 3.5V8H18"></path></svg></span>
          <span class="stack" style="flex: 1; min-width: 0; gap: 2px"><strong class="t-small" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">2025 3월 모의고사 수학.hwp</strong><span class="t-cap muted">20문항 인식 · 로그인 후 그대로 가져갑니다</span></span>
        </div>
        <p class="t-small soft">이 컴퓨터의 작업 계정입니다. 로그인하면 인식한 문항을 편집할 수 있습니다. 유료 구독은 아직 제공하지 않습니다.</p>
        <div class="field">
          <label class="label" for="loginPw">비밀번호</label>
          <input id="loginPw" class="input is-focus" type="password" autocomplete="current-password" minlength="10" aria-describedby="loginPwHelp">
          <span id="loginPwHelp" class="help">10자 이상</span>
        </div>
      </div>
      <div class="dialog-foot">
        <button class="btn btn-ghost" type="button">취소</button>
        <button class="btn btn-primary" type="submit">로그인</button>
      </div>
      <p class="help" style="padding: 0 24px 20px">로그인해도 기본 변환 화면은 그대로입니다. 문항 편집을 고를 때만 작업 공간이 열리고, 취소하면 이 파일의 기본 변환으로 돌아갑니다.</p>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
