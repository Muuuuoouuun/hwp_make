<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계정 만들기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm" style="min-height: 900px; display: flex; flex-direction: column">
  <header class="topbar clean" style="background: transparent">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">H</span>HWP Make</a>
    <a class="btn btn-ghost" href="#">로그인</a>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px 80px">
    <form class="card card-raise stack" style="width: 100%; max-width: 460px; gap: 18px; padding: 36px 32px" aria-labelledby="suTitle">
      <div class="stack" style="gap: 8px">
        <span class="chip chip-info nodot" style="align-self: flex-start">초대 링크로 계정 만들기</span>
        <h1 id="suTitle" class="t-h1" style="font-size: 26px">내 문서 공간을 시작하세요</h1>
        <p class="t-small soft">처음 사용할 계정을 만들어 주세요. 이 설정 링크는 한 번만 사용할 수 있어요.</p>
      </div>
      <div class="field"><label class="label" for="suName">표시 이름</label><input id="suName" class="input" type="text" autocomplete="name" maxlength="60" required></div>
      <div class="field"><label class="label" for="suEmail">이메일</label><input id="suEmail" class="input" type="email" autocomplete="username" required placeholder="teacher@example.com"></div>
      <div class="field"><label class="label" for="suPw">비밀번호</label><input id="suPw" class="input" type="password" autocomplete="new-password" minlength="10" required aria-describedby="suPwHelp"><span id="suPwHelp" class="help">10자 이상</span></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">계정 만들고 시작</button>
      <ul class="stack t-small soft" style="gap: 6px; padding-top: 14px; border-top: 1px solid #d9deea">
        <li class="row" style="gap: 8px"><svg class="icon icon-sm" viewBox="0 0 20 20" aria-hidden="true" style="color: #1d6f4e"><path d="m5 10 3 3 7-7"></path></svg>업로드한 파일과 변환 결과는 내 계정에서만 볼 수 있어요.</li>
        <li class="row" style="gap: 8px"><svg class="icon icon-sm" viewBox="0 0 20 20" aria-hidden="true" style="color: #1d6f4e"><path d="m5 10 3 3 7-7"></path></svg>파일은 30일 보관되며 언제든 삭제할 수 있어요.</li>
      </ul>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
