<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>다운로드</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm" style="min-height: 900px; display: flex; flex-direction: column">
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">H</span>HWP Make</a>
    <a class="btn btn-ghost" href="#">내 작업</a>
  </header>
  <main style="flex: 1; display: flex; justify-content: center; padding: 56px 16px 80px">
    <section class="stack" style="width: 100%; max-width: 600px; gap: 20px" aria-labelledby="dlTitle">
      <p class="status status-ok" role="status"><span class="dot"></span>다운로드를 시작했습니다.</p>
      <div class="card card-raise stack" style="gap: 18px; padding: 24px">
        <div class="row" style="gap: 14px">
          <span class="file-ico" aria-hidden="true" style="width: 52px; height: 52px; background: #e9f6f0; color: #1d6f4e"><svg class="icon" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7z"></path><path d="M12 10v6m0 0-2.5-2.5M12 16l2.5-2.5"></path></svg></span>
          <div class="stack" style="flex: 1; min-width: 0; gap: 2px">
            <h1 id="dlTitle" class="t-h2" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">고1 국어 기말 대비.hwpx</h1>
            <span class="t-small muted t-num">HWPX · 12쪽 · 24문항</span>
          </div>
        </div>
        <dl class="dl t-small t-num" style="padding: 12px 14px; border-radius: 12px; background: #f7f8fb">
          <dt>원본</dt><dd>고1 국어 기말 대비.hwp</dd>
          <dt>보관 기한</dt><dd>2026. 12. 25.까지</dd>
        </dl>
        <div class="stack" style="gap: 8px">
          <a class="btn btn-primary btn-lg btn-block" href="#" download><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"></path></svg>다시 받기</a>
          <p class="help" style="text-align: center">다운로드가 시작되지 않으면 위 버튼을 눌러 주세요.</p>
        </div>
      </div>
      <div class="card card-pad stack" style="gap: 10px">
        <h2 class="t-h3">받은 뒤 한글에서 확인할 것</h2>
        <ul class="stack t-small soft" style="gap: 6px; padding-left: 18px; list-style: disc">
          <li>원본 배치와 수식은 다운로드 후 한글에서 확인해 주세요.</li>
          <li>확인이 필요한 항목은 작업 상세에서 다시 볼 수 있습니다.</li>
          <li>결과가 이상하면 이 작업에서 바로 신고할 수 있어요.</li>
        </ul>
        <div class="wrap-row" style="gap: 8px; margin-top: 4px"><a class="btn" href="#" download>원본 받기</a><a class="btn btn-ghost" href="#">작업 상세</a><button class="btn btn-ghost" type="button" aria-haspopup="dialog">이 작업 신고</button></div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
