<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인 만료</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm" style="position: relative; min-height: 900px; overflow: hidden">
  <div aria-hidden="true">
    <div class="topbar"><span class="brand"><span class="brand-mark">H</span>HWP Make</span><span class="row" style="gap: 8px"><span class="btn btn-ghost">내 작업</span><span class="btn btn-ghost">버그 신고</span></span></div>
    <div class="wrap stack" style="gap: 20px; padding-top: 32px">
      <div class="card" style="height: 80px"></div>
      <div class="split"><div class="card" style="height: 420px"></div><div class="card" style="height: 420px"></div></div>
    </div>
  </div>
  <div class="scrim"></div>
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px">
    <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="seTitle" style="width: 100%; max-width: 440px">
      <div class="dialog-head"><div class="stack" style="gap: 6px"><span class="chip chip-warn" style="align-self: flex-start">로그인 만료</span><h2 id="seTitle" class="t-h2">다시 로그인해 주세요</h2></div></div>
      <div class="dialog-body stack" style="gap: 14px">
        <p class="t-small soft">로그인이 필요합니다. 로그인 시간이 지났거나 다른 곳에서 로그아웃했습니다. 다시 로그인하면 보던 화면으로 돌아갑니다.</p>
        <div class="notice notice-ok t-small" style="padding: 10px 12px"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 10 3 3 7-7"></path></svg><span>이미 접수한 변환은 창을 닫아도 계속 진행됩니다.</span></div>
        <div class="field"><label class="label" for="seEmail">이메일</label><input id="seEmail" class="input" type="email" autocomplete="username" value="teacher@example.com"></div>
        <div class="field"><label class="label" for="sePw">비밀번호</label><input id="sePw" class="input is-focus" type="password" autocomplete="current-password"></div>
      </div>
      <div class="dialog-foot"><a class="btn btn-ghost" href="#">로그인 화면으로</a><button class="btn btn-primary" type="submit">로그인</button></div>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
