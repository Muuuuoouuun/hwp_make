<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기본 변환 실패</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hm.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2447aa}a:hover{color:#172033}
</style>
</helmet>
<div class="hm bg-white" style="min-height: 900px; display: flex; flex-direction: column">
  <header class="topbar clean">
    <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">H</span>HWP Make</a>
    <div class="row" style="gap: 8px">
      <button class="btn btn-ghost" type="button" aria-haspopup="dialog">도움말</button>
      <button class="btn" type="button">로그인</button>
    </div>
  </header>
  <main style="flex: 1; display: flex; justify-content: center; padding: 56px 24px 96px">
    <div class="stack" style="width: 100%; max-width: 640px; gap: 24px">
      <div class="file-row">
        <span class="file-ico" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7z"></path><path d="M13.5 3.5V8H18"></path></svg></span>
        <span class="stack" style="flex: 1; min-width: 0; gap: 2px">
          <strong style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">기말고사 과학 스캔본.pdf</strong>
          <span class="t-small muted"><span class="ext">PDF</span> 11.6MB · 원본은 그대로 선택되어 있습니다</span>
        </span>
        <button class="ibtn" type="button" aria-label="선택한 파일 제거"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8"></path></svg></button>
      </div>

      <section class="card card-pad stack" style="gap: 18px; border-color: #e7b3bb" role="alert" aria-labelledby="failTitle">
        <div class="row" style="gap: 12px">
          <span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: #fff0f2; color: #b42f3f" aria-hidden="true"><svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"></circle><path d="M10 6v5m0 3v.01"></path></svg></span>
          <h1 id="failTitle" class="t-h2">변환하지 못했습니다</h1>
        </div>
        <ol class="stack" style="gap: 10px">
          <li class="row" style="gap: 12px; align-items: flex-start"><span class="chip chip-err" style="flex: none">1차</span><span class="t-small"><strong>원본 배치 복원 실패</strong> · 원본의 문항 배치를 분석하지 못했습니다.</span></li>
          <li class="row" style="gap: 12px; align-items: flex-start"><span class="chip chip-err" style="flex: none">2차</span><span class="t-small"><strong>인식한 문항으로 다시 만들기도 실패</strong> · 문항을 인식하지 못했습니다.</span></li>
        </ol>
        <div class="notice notice-neutral t-small">글자를 선택할 수 없는 스캔 PDF는 문항을 읽지 못할 수 있습니다. 같은 시험지의 HWP·HWPX·DOCX 원본이나 글자가 들어 있는 PDF가 있다면 그 파일로 시도해 보세요.</div>
        <div class="wrap-row" style="gap: 10px">
          <button class="btn btn-primary btn-lg" type="button">다시 시도</button>
          <label class="btn btn-lg" for="failSwap">다른 파일 선택</label>
          <input id="failSwap" class="sr" type="file">
          <button class="btn btn-ghost btn-lg" type="button" aria-haspopup="dialog">버그 신고</button>
        </div>
      </section>

      <p class="status status-err" role="status"><span class="dot"></span>원본 배치 복원 실패 · 인식한 문항으로 다시 만들기도 실패했습니다.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
